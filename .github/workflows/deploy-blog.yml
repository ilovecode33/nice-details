name: Deploy blog to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build blog
        run: bunx turbo run build --filter=@ilovecode33/blog

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/blog/dist --project-name=ilovecode33-blog --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # Declarative zone-level cache rules (cannot live in wrangler.toml).
      # continue-on-error keeps a token-permission issue from failing an
      # otherwise successful site deployment.
      - name: Apply Cloudflare cache rules
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun apps/blog/scripts/apply-cache-rules.ts
