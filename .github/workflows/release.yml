name: Version packages

# Consume pending changesets on every push to main: create or update the
# changesets version PR, validate the bumped workspace, report the required
# `preview` check, and squash-merge it back to main.
#
# The version PR is created with GITHUB_TOKEN, so its own `pull_request`
# workflows do not run. Validation therefore happens in this job: typecheck,
# build and test must pass before the check run is reported and the PR merged.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: write
  actions: write

concurrency:
  group: version-packages
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create or update the version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version:packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate the version bump
        if: steps.changesets.outputs.pullRequestNumber != ''
        run: bunx turbo run typecheck build test

      # The version PR is opened by GITHUB_TOKEN, which does not trigger the
      # Cloudflare preview workflows. Report every required preview check from
      # this workflow after the validation above so branch protection can merge
      # it.
      - name: Report the required preview checks
        if: steps.changesets.outputs.pullRequestNumber != ''
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            for (const name of ['preview', 'preview-ui', 'preview-okr-web']) {
              await github.rest.checks.create({
                owner,
                repo,
                name,
                head_sha: pull.data.head.sha,
                status: 'completed',
                conclusion: 'success',
                output: {
                  title: 'Version packages validated',
                  summary:
                    'The version bump passed typecheck, build and tests on the version branch. A Cloudflare preview is not applicable to a version-only change.',
                },
              });
            }

      - name: Merge the version PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: gh pr merge "$PR_NUMBER" --squash --delete-branch

      # The version commit is pushed by GITHUB_TOKEN, so it does not trigger the
      # deploy workflows on its own. Without this dispatch, production keeps the
      # pre-bump build until the next feature deploy and the About version lags.
      - name: Deploy the version commit
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Let the squash merge land on main before dispatching against it.
          sleep 5
          gh workflow run deploy-okr-web.yml --ref main
