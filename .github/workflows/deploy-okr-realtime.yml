name: Deploy OKR realtime Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Deploys never overlap, so an older run cannot finish after a newer one and
# leave a stale Worker live. A queued run is replaced by the newest one.
concurrency:
  group: deploy-okr-realtime
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect a pending version bump
        id: gate
        uses: ./.github/actions/pending-release

      - name: Set up Bun
        if: steps.gate.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Deploy realtime Worker
        if: steps.gate.outputs.skip != 'true' && env.CLOUDFLARE_WORKERS_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/okr-realtime
          packageManager: bun
          command: deploy
