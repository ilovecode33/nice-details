<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="極簡 WYSIWYG 編輯器：標題、粗體、斜體" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>nice-details editor</h1>
        <p>標題 / 粗體 / 斜體 · 單機版（尚無多人寫作）</p>
      </header>

      <section class="editor" aria-label="編輯器">
        <div class="toolbar" role="toolbar" aria-label="格式工具">
          <div class="toolbar__group" aria-label="標題層級">
            <button type="button" data-command="heading" data-level="1" title="標題 1">H1</button>
            <button type="button" data-command="heading" data-level="2" title="標題 2">H2</button>
            <button type="button" data-command="heading" data-level="3" title="標題 3">H3</button>
          </div>
          <span class="toolbar__divider" aria-hidden="true"></span>
          <div class="toolbar__group" aria-label="文字樣式">
            <button type="button" data-command="bold" title="粗體 (Ctrl/⌘ + B)" aria-label="粗體">
              <strong>B</strong>
            </button>
            <button type="button" data-command="italic" title="斜體 (Ctrl/⌘ + I)" aria-label="斜體">
              <em>I</em>
            </button>
          </div>
        </div>

        <div
          id="editor"
          class="editor__surface"
          data-placeholder="在這裡開始寫作…"
          aria-label="內文"
        ></div>

        <footer class="editor__footer">
          <span id="status" class="editor__status">準備就緒</span>
          <details class="editor__inspect">
            <summary>查看 HTML</summary>
            <pre id="output" class="editor__output"></pre>
          </details>
        </footer>
      </section>
    </main>
  </body>
</html>
