<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Minimal WYSIWYG editor: heading, bold, italic" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>nice-details editor</h1>
        <p>Heading / bold / italic · local only (no collaboration yet)</p>
      </header>

      <section class="editor" aria-label="Editor">
        <div class="toolbar" role="toolbar" aria-label="Formatting">
          <div class="toolbar__group" aria-label="Heading levels">
            <button type="button" data-command="heading" data-level="1" title="Heading 1">H1</button>
            <button type="button" data-command="heading" data-level="2" title="Heading 2">H2</button>
            <button type="button" data-command="heading" data-level="3" title="Heading 3">H3</button>
          </div>
          <span class="toolbar__divider" aria-hidden="true"></span>
          <div class="toolbar__group" aria-label="Text styles">
            <button type="button" data-command="bold" title="Bold (Ctrl/⌘ + B)" aria-label="Bold">
              <strong>B</strong>
            </button>
            <button type="button" data-command="italic" title="Italic (Ctrl/⌘ + I)" aria-label="Italic">
              <em>I</em>
            </button>
          </div>
        </div>

        <div
          id="editor"
          class="editor__surface"
          data-placeholder="Start writing here…"
          aria-label="Body"
        ></div>

        <footer class="editor__footer">
          <span id="status" class="editor__status">Ready</span>
          <details class="editor__inspect">
            <summary>View HTML</summary>
            <pre id="output" class="editor__output"></pre>
          </details>
        </footer>
      </section>
    </main>
  </body>
</html>
